name: Core compatibility and isolation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-server.txt pytest==9.1.1
      - run: python -m pytest -q
      - run: python -m mikubot --help
      - run: python -m qunyu --help
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose build
      - run: python -c "import subprocess; from mikubot.sandbox import IMAGE; subprocess.run(['docker','pull',IMAGE],check=True)"
      - run: python scripts/check_docker_isolation.py --require
